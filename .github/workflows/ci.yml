name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://vidya:ci-only-pg@localhost:5432/vidya
      REDIS_URL: redis://localhost:6379
      # MinIO service below — the bulk-import integration tests use it.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY_ID: ci-only
      S3_SECRET_ACCESS_KEY: ci-only-secret
      S3_BUCKET: vidya-int
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vidya
          POSTGRES_PASSWORD: ci-only-pg
          POSTGRES_DB: vidya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vidya -d vidya"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      minio:
        # bitnami image starts the server without a command override
        # (GitHub service containers cannot set one).
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: ci-only
          MINIO_ROOT_PASSWORD: ci-only-secret
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (includes Constitution boundary rules)
        run: pnpm lint

      - name: No deferred-work markers in non-test code
        run: pnpm check:todos

      - name: Table-ownership convention
        run: pnpm check:ownership

      - name: Docker workspace manifest coverage
        run: pnpm check:docker-manifests

      - name: OpenAPI spec in sync with route declarations
        run: pnpm openapi:check

      - name: Unit tests with coverage gate
        run: pnpm test:coverage

      - name: Migration forward + rollback + forward (proves down migrations)
        run: |
          pnpm db:migrate
          pnpm db:rollback
          pnpm db:migrate

      - name: Integration tests (Postgres + Redis + BullMQ end-to-end)
        env:
          INTEGRATION_RESET_DB: "true"
        run: pnpm test:integration

      - name: Next.js production build
        run: pnpm build

      # E2E (#8): the only tier that exercises Next.js's real file-based router
      # in a real browser over real HTTP — the guard against orphaned routes.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Seed demo data for E2E
        env:
          VIDYA_ALLOW_DEMO_SEED: "true"
        run: |
          pnpm db:migrate
          pnpm seed:demo

      - name: E2E (real browser + HTTP through the App Router)
        env:
          # The e2e web server and worker run against the compose-equivalent
          # service containers above; plain http in CI, so no Secure cookie.
          SESSION_COOKIE_SECURE: "false"
          VIDYA_ALLOW_DEMO_SEED: "true"
        run: |
          pnpm dev:worker &
          WORKER_PID=$!
          pnpm test:e2e
          kill "$WORKER_PID" 2>/dev/null || true

      - name: School E2E (isolated school edition + real browser)
        timeout-minutes: 15
        run: pnpm test:e2e:school

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
